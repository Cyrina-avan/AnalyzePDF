[project]
name = "analyzepdf-runtime-ppstructure"
version = "0.0.0"
description = "AnalyzePDF 保存的 PP-StructureV3 历史研究环境。"
requires-python = ">=3.12,<3.13"
dependencies = [
  "nvidia-cublas-cu12>=12.9,<13",
  "nvidia-cuda-cupti-cu12>=12.9,<13",
  "nvidia-cuda-nvrtc-cu12>=12.9,<13",
  "nvidia-cuda-runtime-cu12>=12.9,<13",
  "nvidia-cudnn-cu12>=9,<10",
  "nvidia-cufft-cu12>=11,<12",
  "nvidia-curand-cu12>=10,<11",
  "nvidia-cusolver-cu12>=11,<12",
  "nvidia-cusparse-cu12>=12,<13",
  "nvidia-nvjitlink-cu12>=12.9,<13",
  "nvidia-nvtx-cu12>=12,<13",
  "paddleocr[doc-parser]==3.7.0",
  "paddlepaddle-gpu==3.3.1",
]

[[tool.uv.index]]
name = "paddle-cu129"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu129/"
explicit = true

[tool.uv.sources]
paddlepaddle-gpu = { index = "paddle-cu129" }
